services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: project_a
    volumes:
      - pgdata:/var/lib/postgresql
      - ./database/project_a.dump:/docker-entrypoint-initdb.d/project_a.dump:ro
      - ./database/init/01-restore.sh:/docker-entrypoint-initdb.d/01-restore.sh:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  face-service:
    build: ./backend/services/face
    environment:
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: reference-faces
    ports:
      - "8000:8000"
    depends_on:
      minio:
        condition: service_healthy

  db-service:
    build: ./backend/services/db-service
    environment:
      DB_USER: postgres
      DB_HOST: postgres
      DB_NAME: project_a
      DB_PASSWORD: postgres
      DB_PORT: 5432
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build: ./backend
    environment:
      PORT: 3000
      NODE_ENV: development
      DB_SERVICE_URL: http://db-service:8001
      SESSION_SECRET: change_this_to_a_long_random_string_in_production
      CORS_ORIGINS: http://localhost:5173
      SSL_KEY_PATH: ""
      SSL_CERT_PATH: ""
      FACE_API_URL: http://face-service:8000
    ports:
      - "3000:3000"
    depends_on:
      - db-service
      - face-service

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:3000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
  minio_data:
